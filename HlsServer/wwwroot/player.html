<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HLS Stream Test Player</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101211;
      --panel: #181b1a;
      --panel-2: #222724;
      --line: #3a413d;
      --text: #f3f0e8;
      --muted: #aaa89f;
      --green: #8bd27c;
      --amber: #e5b95f;
      --blue: #8db7e8;
      --red: #ef8a75;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background:
        linear-gradient(135deg, rgba(139, 210, 124, .08), transparent 32rem),
        linear-gradient(315deg, rgba(229, 185, 95, .08), transparent 28rem),
        var(--bg);
      color: var(--text);
      font-family: "Aptos", "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 32px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 2.8vw, 2.6rem);
      font-weight: 650;
      letter-spacing: 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      background: rgba(24, 27, 26, .84);
      color: var(--muted);
      white-space: nowrap;
    }

    .status::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--amber);
      box-shadow: 0 0 12px rgba(229, 185, 95, .6);
    }

    .status.ready::before {
      background: var(--green);
      box-shadow: 0 0 12px rgba(139, 210, 124, .6);
    }

    .status.error::before {
      background: var(--red);
      box-shadow: 0 0 12px rgba(239, 138, 117, .6);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 16px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(24, 27, 26, .94);
      box-shadow: 0 18px 48px rgba(0, 0, 0, .34);
      overflow: hidden;
    }

    .viewer {
      background: #050606;
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #050606;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }

    .source-row {
      display: flex;
      flex: 1 1 420px;
      min-width: 0;
      gap: 8px;
    }

    input {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 10px;
      background: #0d0f0e;
      color: var(--text);
    }

    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 12px;
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
    }

    button:hover {
      border-color: var(--green);
    }

    button.active {
      border-color: var(--green);
      background: rgba(139, 210, 124, .16);
      color: #ddffd8;
    }

    .side {
      display: grid;
      gap: 16px;
    }

    .section {
      padding: 14px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: .86rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .stats,
    .levels {
      display: grid;
      gap: 8px;
    }

    .stat,
    .level {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      min-height: 34px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #121514;
      color: var(--muted);
    }

    .stat strong,
    .level strong {
      color: var(--text);
      font-weight: 600;
      text-align: right;
    }

    .level {
      width: 100%;
    }

    .events {
      height: 220px;
      overflow: auto;
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: #0d0f0e;
      color: #d7d1c1;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: .78rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    @media (max-width: 900px) {
      header {
        align-items: start;
        flex-direction: column;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .side {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .shell {
        width: min(100% - 20px, 1180px);
        padding-top: 14px;
      }

      .toolbar,
      .source-row {
        flex-direction: column;
        align-items: stretch;
      }

      .side {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>HLS Stream Test Player</h1>
      <div id="status" class="status">Initializing</div>
    </header>

    <section class="grid">
      <div class="panel viewer">
        <video id="video" controls playsinline crossorigin="anonymous">
          <track id="markerTrack" kind="metadata" label="EEG markers" src="/hls/eeg-markers.vtt" default>
        </video>
        <div class="toolbar">
          <div class="source-row">
            <input id="sourceInput" value="/hls/master.m3u8" aria-label="HLS manifest URL">
            <button id="loadButton" type="button">Load</button>
          </div>
          <button id="copyButton" type="button">Copy URL</button>
        </div>
      </div>

      <aside class="side">
        <div class="panel section">
          <h2>Playback</h2>
          <div class="stats">
            <div class="stat"><span>Manifest</span><strong id="manifestValue">/hls/master.m3u8</strong></div>
            <div class="stat"><span>Mode</span><strong id="modeValue">Detecting</strong></div>
            <div class="stat"><span>Current level</span><strong id="levelValue">Auto</strong></div>
            <div class="stat"><span>Resolution</span><strong id="resolutionValue">-</strong></div>
            <div class="stat"><span>Markers</span><strong id="markerValue">Checking</strong></div>
          </div>
        </div>

        <div class="panel section">
          <h2>Quality</h2>
          <div id="levels" class="levels"></div>
        </div>

        <div class="panel section">
          <h2>Events</h2>
          <pre id="events" class="events"></pre>
        </div>
      </aside>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <script>
    const video = document.getElementById("video");
    const sourceInput = document.getElementById("sourceInput");
    const loadButton = document.getElementById("loadButton");
    const copyButton = document.getElementById("copyButton");
    const status = document.getElementById("status");
    const events = document.getElementById("events");
    const levels = document.getElementById("levels");
    const manifestValue = document.getElementById("manifestValue");
    const modeValue = document.getElementById("modeValue");
    const levelValue = document.getElementById("levelValue");
    const resolutionValue = document.getElementById("resolutionValue");
    const markerValue = document.getElementById("markerValue");

    const querySource = new URLSearchParams(window.location.search).get("src");
    let hls = null;

    if (querySource) {
      sourceInput.value = querySource;
    }

    function setStatus(text, state) {
      status.textContent = text;
      status.className = `status ${state || ""}`.trim();
    }

    function log(text) {
      const stamp = new Date().toLocaleTimeString();
      events.textContent = `[${stamp}] ${text}\n${events.textContent}`.slice(0, 6000);
    }

    function formatBandwidth(value) {
      if (!value) return "-";
      return `${Math.round(value / 1000)} kbps`;
    }

    function renderLevels() {
      levels.innerHTML = "";

      const autoButton = document.createElement("button");
      autoButton.type = "button";
      autoButton.className = "level active";
      autoButton.innerHTML = "<span>Auto</span><strong>Adaptive</strong>";
      autoButton.addEventListener("click", () => {
        if (hls) {
          hls.currentLevel = -1;
          updateLevel();
          renderLevels();
        }
      });
      levels.appendChild(autoButton);

      if (!hls || !hls.levels.length) {
        return;
      }

      hls.levels.forEach((item, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `level ${hls.currentLevel === index ? "active" : ""}`;
        button.innerHTML = `<span>${item.height || "?"}p</span><strong>${formatBandwidth(item.bitrate)}</strong>`;
        button.addEventListener("click", () => {
          hls.currentLevel = index;
          updateLevel();
          renderLevels();
        });
        levels.appendChild(button);
      });
    }

    function updateLevel() {
      if (!hls) {
        levelValue.textContent = "Native";
        return;
      }

      const selected = hls.currentLevel;
      const actual = hls.currentLevel >= 0 ? hls.currentLevel : hls.nextLoadLevel;
      const item = hls.levels[actual] || hls.levels[hls.loadLevel];

      levelValue.textContent = selected === -1 ? "Auto" : `${item?.height || "?"}p`;
      resolutionValue.textContent = item ? `${item.width}x${item.height}` : "-";
    }

    async function updateMarkerStatus() {
      try {
        const response = await fetch("/hls/eeg-markers.vtt", { cache: "no-store" });
        if (!response.ok) {
          markerValue.textContent = "Unavailable";
          return;
        }

        const text = await response.text();
        const count = (text.match(/-->/g) || []).length;
        markerValue.textContent = `${count} cues`;
      } catch {
        markerValue.textContent = "Unavailable";
      }
    }

    function destroyHls() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
      video.removeAttribute("src");
      video.load();
    }

    function loadSource() {
      const source = sourceInput.value.trim() || "/hls/master.m3u8";
      sourceInput.value = source;
      manifestValue.textContent = source;
      destroyHls();
      setStatus("Loading manifest", "");
      log(`Loading ${source}`);

      if (window.Hls && Hls.isSupported()) {
        modeValue.textContent = "hls.js";
        hls = new Hls({
          capLevelToPlayerSize: true,
          enableWorker: true
        });

        hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
          setStatus("Ready", "ready");
          log(`Manifest parsed: ${data.levels.length} levels`);
          renderLevels();
          updateLevel();
        });

        hls.on(Hls.Events.LEVEL_SWITCHED, (_, data) => {
          updateLevel();
          renderLevels();
          log(`Level switched: ${data.level}`);
        });

        hls.on(Hls.Events.ERROR, (_, data) => {
          const message = `${data.type}: ${data.details}`;
          log(message);
          if (data.fatal) {
            setStatus(message, "error");
          }
        });

        hls.loadSource(source);
        hls.attachMedia(video);
        return;
      }

      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        modeValue.textContent = "Native HLS";
        video.src = source;
        video.addEventListener("loadedmetadata", () => {
          setStatus("Ready", "ready");
          levelValue.textContent = "Native";
          resolutionValue.textContent = `${video.videoWidth}x${video.videoHeight}`;
        }, { once: true });
        renderLevels();
        return;
      }

      modeValue.textContent = "Unsupported";
      setStatus("HLS is not supported in this browser", "error");
      log("HLS is not supported. The hls.js CDN may also be blocked.");
      renderLevels();
    }

    loadButton.addEventListener("click", loadSource);
    sourceInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        loadSource();
      }
    });

    copyButton.addEventListener("click", async () => {
      const url = new URL(window.location.href);
      url.searchParams.set("src", sourceInput.value.trim() || "/hls/master.m3u8");
      await navigator.clipboard.writeText(url.toString());
      log("Copied player URL");
    });

    video.addEventListener("error", () => {
      setStatus("Video error", "error");
      log("Video element reported an error");
    });

    video.addEventListener("loadedmetadata", () => {
      if (!hls) {
        resolutionValue.textContent = `${video.videoWidth}x${video.videoHeight}`;
      }
    });

    updateMarkerStatus();
    renderLevels();
    loadSource();
  </script>
</body>
</html>
