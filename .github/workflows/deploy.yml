name: Deploy HLS Video Streamer to Azure

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      upload_storage:
        description: 'Upload HLS content to storage'
        required: false
        default: 'false'

env:
  REGISTRY: cld1connectors1reg.azurecr.io
  IMAGE_NAME: hls-video-streamer
  RESOURCE_GROUP: dheeraj-test-grp
  LOCATION: centralindia
  SUBSCRIPTION_ID: e1e63070-eac9-4df6-8590-c5f50ceef3c1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy-infra:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

      - name: Validate Bicep template
        run: |
          az deployment group validate \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam

      - name: Deploy infrastructure
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --name "hls-deploy-${{ github.run_number }}"

      - name: Get Container App URL
        id: ca-output
        run: |
          URL=$(az containerapp show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name hls-video-streamer \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          echo "container_app_url=https://$URL" >> $GITHUB_OUTPUT

      - name: Save deployment info
        run: |
          echo "Container App deployed at: ${{ steps.ca-output.outputs.container_app_url }}" >> $GITHUB_STEP_SUMMARY

  deploy-storage:
    needs: deploy-infra
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: github.event.inputs.upload_storage == 'true' || github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

      - name: Upload HLS content to storage
        run: |
          STORAGE_KEY=$(az storage account keys list \
            --account-name dheerajhospitalsa \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query '[0].value' -o tsv)
          
          # Create containers
          az storage container create \
            --name hls-vod \
            --account-name dheerajhospitalsa \
            --account-key $STORAGE_KEY \
            --public-access blob 2>/dev/null || true
          
          # Upload content with correct content types
          for file in $(find public/local-video -type f); do
            BLOB_PATH=${file#public/local-video/}
            CONTENT_TYPE="application/octet-stream"
            
            case $file in
              *.m3u8) CONTENT_TYPE="application/vnd.apple.mpegurl";;
              *.ts) CONTENT_TYPE="video/mp2t";;
              *.vtt) CONTENT_TYPE="text/vtt";;
              *.mp4) CONTENT_TYPE="video/mp4";;
            esac
            
            az storage blob upload \
              --file "$file" \
              --container-name hls-vod \
              --name "$BLOB_PATH" \
              --account-name dheerajhospitalsa \
              --account-key $STORAGE_KEY \
              --content-type "$CONTENT_TYPE" \
              --overwrite
          done

  smoke-test:
    needs: deploy-storage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

      - name: Get Container App URL
        id: ca-url
        run: |
          URL=$(az containerapp show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name hls-video-streamer \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          echo "url=https://$URL" >> $GITHUB_OUTPUT

      - name: Wait for app to be ready
        run: |
          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${{ steps.ca-url.outputs.url }} || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Application is ready"
              exit 0
            fi
            echo "Waiting... (attempt $i/30, HTTP $HTTP_CODE)"
            sleep 10
          done
          echo "✗ Application failed to become ready"
          exit 1

      - name: Test health endpoint
        run: |
          curl -v ${{ steps.ca-url.outputs.url }}/

      - name: Test HLS manifest endpoint
        run: |
          curl -v ${{ steps.ca-url.outputs.url }}/hls/master.m3u8 || echo "Note: manifest may not exist on first deploy"

      - name: Test player endpoint
        run: |
          curl -v ${{ steps.ca-url.outputs.url }}/player.html

      - name: Deployment summary
        run: |
          echo "✓ HLS Video Streamer deployed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Container App URL:** ${{ steps.ca-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ env.LOCATION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Storage Account:** dheerajhospitalsa" >> $GITHUB_STEP_SUMMARY
